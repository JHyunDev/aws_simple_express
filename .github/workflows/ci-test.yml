name: CI Test


on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Start application
        working-directory: backend
        run: |
          node server.js &
          sleep 3

      - name: Health check
        run: curl --fail http://localhost:3000/health

      - name: Create deployment artifact
        working-directory: backend
        run: |
          tar \
            --exclude='.env' \
            --exclude='*.log' \
            -czf /tmp/wardrobe-backend.tar.gz .
          
          ls -lh /tmp/wardrobe-backend.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::066036524900:role/WardrobeGitHubActionsRole
          aws-region: ap-northeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Generate temporary SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/wardrobe_key -N ""

      - name: Send temporary SSH public key to EC2-A
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id i-09f328a19c5fdbfac \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/wardrobe_key.pub \
            --region ap-northeast-2

      - name: Send temporary SSH public key to EC2-B
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id i-097a57ea84e806ee5 \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/wardrobe_key.pub \
            --region ap-northeast-2

      - name: Test SSH through EICE to EC2-A
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-09f328a19c5fdbfac --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-09f328a19c5fdbfac \
            "hostname && whoami"

      - name: Test SSH through EICE to EC2-B
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-097a57ea84e806ee5 --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-097a57ea84e806ee5 \
            "hostname && whoami"

      - name: Copy artifact to EC2-A
        run: |
          scp \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-09f328a19c5fdbfac --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            /tmp/wardrobe-backend.tar.gz \
            ubuntu@i-09f328a19c5fdbfac:/home/ubuntu/wardrobe-backend.tar.gz

      - name: Verify release on EC2-A
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-09f328a19c5fdbfac --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-09f328a19c5fdbfac \
            'bash -s' <<'EOF'
              set -e

              RELEASE_DIR=/home/ubuntu/wardrobe-releases/github-test

              echo "=== 1. Prepare release directory ==="
              rm -rf "$RELEASE_DIR"
              mkdir -p "$RELEASE_DIR"

              echo "=== 2. Extract artifact ==="
              tar -xzf /home/ubuntu/wardrobe-backend.tar.gz \
                -C "$RELEASE_DIR"

              echo "=== 3. Link environment file ==="
              ln -s \
                /home/ubuntu/aws_simple_express/backend/.env \
                "$RELEASE_DIR/.env"

              echo "=== 4. Start candidate on port 3001 ==="
              cd "$RELEASE_DIR"

              PORT=3001 node server.js \
                > /tmp/wardrobe-precheck.log 2>&1 &

              TEST_PID=$!

              trap 'kill $TEST_PID 2>/dev/null || true' EXIT

              sleep 3

              echo "=== 5. Check listening socket ==="
              ss -lntp | grep ':3001'

              echo "=== 6. Check Express health ==="
              curl --fail http://localhost:3001/health

              echo ""

              echo "=== 7. Check DB health ==="
              curl --fail http://localhost:3001/health/db

              echo ""

              echo "=== PRE-DEPLOY CHECK PASSED ==="
          EOF

      - name: Promote release on EC2-A
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-09f328a19c5fdbfac --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-09f328a19c5fdbfac \
            'bash -s' <<'EOF'
              set -e

              RELEASE_DIR=/home/ubuntu/wardrobe-releases/github-test

              echo "=== 1. Stop old PM2 process ==="
              pm2 delete wardrobe

              echo "=== 2. Start new release on production port ==="
              cd "$RELEASE_DIR"
              pm2 start server.js --name wardrobe

              sleep 3

              echo "=== 3. Check production listening socket ==="
              ss -lntp | grep ':3000'

              echo "=== 4. Check production health ==="
              curl --fail http://localhost:3000/health

              echo ""

              echo "=== 5. Check production DB health ==="
              curl --fail http://localhost:3000/health/db

              echo ""

              echo "=== 6. Save PM2 process list ==="
              pm2 save

              echo "=== EC2-A DEPLOYMENT SUCCESS ==="
          EOF

      - name: Copy artifact to EC2-B
        run: |
          scp \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-097a57ea84e806ee5 --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            /tmp/wardrobe-backend.tar.gz \
            ubuntu@i-097a57ea84e806ee5:/home/ubuntu/wardrobe-backend.tar.gz
