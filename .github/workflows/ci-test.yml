name: CI Test


on: #언제 실행할것인가?
  push:
    branches:
      - main #main branch에 push했을때 이 yaml파일(런처 스크립트)을 실행

concurrency:
  group: wardrobe-production-deploy #운영배포의 동시 실행 방지
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  

jobs: #어떤 작업 묶음을 돌릴것인가?
  test:
    runs-on: ubuntu-latest

    steps: # 순서대로 어떤 작업을 돌릴것인가?
      - name: Checkout repository
        uses: actions/checkout@v5 #다른사람들이 만들어둔 action사용

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: backend
        run: npm ci #직접 shell 명령 실행

      - name: Start application
        working-directory: backend #어느 폴더에서 실행할 것인가?
        run: |
          node server.js &
          sleep 3

      - name: Health check #여기까지 github Actions 자체 서버에서 자체적으로 서버가 동작하는지 테스트
        run: curl --fail http://localhost:3000/health

      - name: Create deployment artifact #위의 결과물 (의존성(node_modules) + 프로그램 소스 한데 묶어놓음)
        working-directory: backend
        run: |
          tar \
            --exclude='.env' \
            --exclude='*.log' \
            -czf /tmp/wardrobe-backend.tar.gz .
          
          ls -lh /tmp/wardrobe-backend.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5 #
        with:
          role-to-assume: arn:aws:iam::066036524900:role/WardrobeGitHubActionsRole
          aws-region: ap-northeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify ALB target group access
        env:
          TG_ARN: ${{ vars.WARDROBE_TG_ARN }}
        run: |
          set -euo pipefail

          echo "=== Verify Target Group ARN ==="
          test -n "$TG_ARN"

          echo "=== Describe Target Health ==="
          aws elbv2 describe-target-health \
            --target-group-arn "$TG_ARN" \
            --region ap-northeast-2 \
            --query 'TargetHealthDescriptions[*].[Target.Id,Target.Port,TargetHealth.State]' \
            --output table

          echo "=== Verify both targets are Healthy ==="

          for INSTANCE_ID in \
            i-09f328a19c5fdbfac \
            i-097a57ea84e806ee5
          do
            STATE=$(aws elbv2 describe-target-health \
              --target-group-arn "$TG_ARN" \
              --targets Id="$INSTANCE_ID",Port=3000 \
              --region ap-northeast-2 \
              --query 'TargetHealthDescriptions[0].TargetHealth.State' \
              --output text)

            echo "$INSTANCE_ID: $STATE"

            if [ "$STATE" != "healthy" ]; then
              echo "ERROR: $INSTANCE_ID is not Healthy"
              exit 1
            fi
          done

          echo "=== ALB PREFLIGHT CHECK PASSED ==="
      - name: Generate temporary SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/wardrobe_key -N ""

      - name: Send temporary SSH public key to EC2-A
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id i-09f328a19c5fdbfac \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/wardrobe_key.pub \
            --region ap-northeast-2

      - name: Send temporary SSH public key to EC2-B
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id i-097a57ea84e806ee5 \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/wardrobe_key.pub \
            --region ap-northeast-2

      - name: Test SSH through EICE to EC2-A
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-09f328a19c5fdbfac --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-09f328a19c5fdbfac \
            "hostname && whoami"

      - name: Test SSH through EICE to EC2-B
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-097a57ea84e806ee5 --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-097a57ea84e806ee5 \
            "hostname && whoami"

      - name: Copy artifact to EC2-A
        run: |
          scp \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-09f328a19c5fdbfac --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            /tmp/wardrobe-backend.tar.gz \
            ubuntu@i-09f328a19c5fdbfac:/home/ubuntu/wardrobe-backend.tar.gz

      - name: Verify release on EC2-A
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-09f328a19c5fdbfac --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-09f328a19c5fdbfac \
            "bash -s -- $GITHUB_SHA" <<'EOF'
              set -e

              RELEASE_ID="$1"
              RELEASE_DIR="/home/ubuntu/wardrobe-releases/$RELEASE_ID"

              echo "=== Release ID ==="
              echo "$RELEASE_ID"

              echo "=== 1. Prepare release directory ==="

              if [ ! -d "$RELEASE_DIR" ]; then
                mkdir -p "$RELEASE_DIR"

                tar -xzf /home/ubuntu/wardrobe-backend.tar.gz \
                  -C "$RELEASE_DIR"

                ln -s \
                  /home/ubuntu/aws_simple_express/backend/.env \
                  "$RELEASE_DIR/.env"
              else
                echo "Release already exists: $RELEASE_DIR"
              fi

              echo "=== 2. Start candidate on port 3001 ==="
              cd "$RELEASE_DIR"

              PORT=3001 node server.js \
                > /tmp/wardrobe-precheck.log 2>&1 &

              TEST_PID=$!

              trap 'kill $TEST_PID 2>/dev/null || true' EXIT

              sleep 3

              echo "=== 3. Check listening socket ==="
              ss -lntp | grep ':3001'

              echo "=== 4. Check Express health ==="
              curl --fail http://localhost:3001/health

              echo ""

              echo "=== 5. Check DB health ==="
              curl --fail http://localhost:3001/health/db

              echo ""

              echo "=== PRE-DEPLOY CHECK PASSED ==="
          EOF
          
      - name: Drain EC2-A before deployment #EC2 B가 Healthy인지 확인-> healthy이면 EC2 A 제외, 아니면 제외 X
        id: drain_a
        env:
          TG_ARN: ${{ vars.WARDROBE_TG_ARN }}
          EC2_A: i-09f328a19c5fdbfac
          EC2_B: i-097a57ea84e806ee5
        run: |
          set -euo pipefail

          echo "=== Check EC2-B is Healthy ==="                            

          B_STATE=$(aws elbv2 describe-target-health \
            --target-group-arn "$TG_ARN" \
            --targets Id="$EC2_B",Port=3000 \
            --query 'TargetHealthDescriptions[0].TargetHealth.State' \
            --output text)

          if [ "$B_STATE" != "healthy" ]; then
            echo "EC2-B is not healthy. Abort."
            exit 1
          fi

          echo "=== Deregister EC2-A ==="

          echo "attempted=true" >> "$GITHUB_OUTPUT"

          aws elbv2 deregister-targets \
            --target-group-arn "$TG_ARN" \
            --targets Id="$EC2_A",Port=3000

          echo "=== Wait for Draining ==="

          aws elbv2 wait target-deregistered \
            --target-group-arn "$TG_ARN" \
            --targets Id="$EC2_A",Port=3000

          echo "=== EC2-A DRAIN COMPLETE ==="
          
      - name: Refresh SSH public key for EC2-A
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id i-09f328a19c5fdbfac \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/wardrobe_key.pub \
            --region ap-northeast-2
      
      - name: Promote release on EC2-A with rollback
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-09f328a19c5fdbfac --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-09f328a19c5fdbfac \
            "bash -s -- $GITHUB_SHA" <<'EOF'
              set -e

              RELEASE_ID="$1"
              NEW_RELEASE="/home/ubuntu/wardrobe-releases/$RELEASE_ID"
              CURRENT_LINK=/home/ubuntu/wardrobe-current

              echo "=== 1. Save previous release ==="
              PREVIOUS_RELEASE=$(readlink -f "$CURRENT_LINK")

              echo "Previous release: $PREVIOUS_RELEASE"
              echo "New release:      $NEW_RELEASE"

              echo "=== 2. Switch current symlink ==="
              ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"

              echo "=== 3. Restart PM2 ==="
              pm2 restart wardrobe

              sleep 3

              echo "=== 4. Post-deploy health check ==="

              if curl --fail http://localhost:3000/health \
                && curl --fail http://localhost:3000/health/db
              then
                echo ""
                echo "=== DEPLOYMENT SUCCESS ==="

                pm2 save

              else
                echo ""
                echo "=== DEPLOYMENT FAILED ==="
                echo "Rolling back to: $PREVIOUS_RELEASE"

                ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"

                pm2 restart wardrobe

                sleep 3

                echo "=== Rollback health check ==="

                curl --fail http://localhost:3000/health
                curl --fail http://localhost:3000/health/db

                echo ""
                echo "=== ROLLBACK SUCCESS ==="

                exit 1
              fi
          EOF

      - name: Restore EC2-A to ALB
        if: ${{ always() && steps.drain_a.outputs.attempted == 'true' }}
        env:
          TG_ARN: ${{ vars.WARDROBE_TG_ARN }}
          EC2_A: i-09f328a19c5fdbfac
        run: |
          set -euo pipefail

          echo "=== Register EC2-A ==="

          aws elbv2 register-targets \
            --target-group-arn "$TG_ARN" \
            --targets Id="$EC2_A",Port=3000

          echo "=== Wait for EC2-A Healthy ==="

          aws elbv2 wait target-in-service \
            --target-group-arn "$TG_ARN" \
            --targets Id="$EC2_A",Port=3000

          echo "=== EC2-A RESTORED AND HEALTHY ==="

      - name: Refresh SSH public key for EC2-B
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id i-097a57ea84e806ee5 \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/wardrobe_key.pub \
            --region ap-northeast-2

      - name: Copy artifact to EC2-B
        run: |
          scp \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-097a57ea84e806ee5 --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            /tmp/wardrobe-backend.tar.gz \
            ubuntu@i-097a57ea84e806ee5:/home/ubuntu/wardrobe-backend.tar.gz

      - name: Verify release on EC2-B
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-097a57ea84e806ee5 --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-097a57ea84e806ee5 \
            "bash -s -- $GITHUB_SHA" <<'EOF'
              set -e

              RELEASE_ID="$1"
              RELEASE_DIR="/home/ubuntu/wardrobe-releases/$RELEASE_ID"

              if [ ! -d "$RELEASE_DIR" ]; then
                mkdir -p "$RELEASE_DIR"

                tar -xzf /home/ubuntu/wardrobe-backend.tar.gz \
                  -C "$RELEASE_DIR"

                ln -s \
                  /home/ubuntu/aws_simple_express/backend/.env \
                  "$RELEASE_DIR/.env"
              fi

              cd "$RELEASE_DIR"

              PORT=3001 node server.js \
                > /tmp/wardrobe-precheck.log 2>&1 &

              TEST_PID=$!
              trap 'kill $TEST_PID 2>/dev/null || true' EXIT

              sleep 3

              ss -lntp | grep ':3001'
              curl --fail http://localhost:3001/health
              curl --fail http://localhost:3001/health/db

              echo "=== EC2-B PRE-DEPLOY CHECK PASSED ==="
          EOF

      - name: Refresh SSH public key for EC2-B before promote
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id i-097a57ea84e806ee5 \
            --instance-os-user ubuntu \
            --ssh-public-key file:///tmp/wardrobe_key.pub \
            --region ap-northeast-2

      - name: Promote release on EC2-B with rollback
        run: |
          ssh \
            -i /tmp/wardrobe_key \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --instance-id i-097a57ea84e806ee5 --instance-connect-endpoint-id eice-0552b70076fcf78b9" \
            ubuntu@i-097a57ea84e806ee5 \
            "bash -s -- $GITHUB_SHA" <<'EOF'
              set -e

              RELEASE_ID="$1"
              NEW_RELEASE="/home/ubuntu/wardrobe-releases/$RELEASE_ID"
              CURRENT_LINK=/home/ubuntu/wardrobe-current

              PREVIOUS_RELEASE=$(readlink -f "$CURRENT_LINK")

              echo "Previous release: $PREVIOUS_RELEASE"
              echo "New release:      $NEW_RELEASE"

              ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"

              pm2 restart wardrobe

              sleep 3

              if curl --fail http://localhost:3000/health \
                && curl --fail http://localhost:3000/health/db
              then
                echo "=== EC2-B DEPLOYMENT SUCCESS ==="
                pm2 save
              else
                echo "=== EC2-B DEPLOYMENT FAILED ==="
                echo "Rolling back to: $PREVIOUS_RELEASE"

                ln -sfn "$PREVIOUS_RELEASE" "$CURRENT_LINK"

                pm2 restart wardrobe

                sleep 3

                curl --fail http://localhost:3000/health
                curl --fail http://localhost:3000/health/db

                echo "=== EC2-B ROLLBACK SUCCESS ==="

                exit 1
              fi
          EOF
            
