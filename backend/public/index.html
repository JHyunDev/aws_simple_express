<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>API Test Page</title>
</head>
<body>
  <h1>API 연결 테스트</h1>
  <button id="btn">GET /api/hello</button>

  <pre id="result"></pre>

  <h2>아이템 목록 조회</h2>

  <button id="loadItems">GET /api/items</button>

  <ul id="itemList"></ul>

  <script>
    document.getElementById('btn').addEventListener('click', async () => { 
      const res = await fetch('/api/hello');
      const data = await res.json();
      document.getElementById('result').textContent =
        JSON.stringify(data, null, 2);

    document.getElementById('loadItems').addEventListener('click', async () => { //html에서 id가 loadItems인 버튼을 js가 잡는다 & 이 버튼이 클릭되면 -> 다음 함수를 실행하라 & 여기서 async는 함수 안에서 await을 쓰기 위한 표시


      const res = await fetch('/api/items'); //브라우저가 서버에 요청 보냄 (GET /api/items 호출)

      const items = await res.json(); // res.json으로 원래 json형식인 서버 응답을 js 배열/객체로 바꾼다

      const itemList = document.getElementById('itemList'); //목록을 표시할 자리 (id가 itemsList인 태그) 찾기

      itemList.innerHTML = ''; //버튼을 여러번 눌러도 중복데이터가 쌓이지 않도록 기존목록 지우기

      items.forEach((item) => { //items안에 있는 데이터를 하나씩 꺼내는 반복문
        const li = document.createElement('li'); //JS로 HTML태그 만들기

        li.textContent = `${item.name} - ${item.user_name}`; // 아이템 이름과 사용자 이름을 화면에 표시할 문장으로 만들기 ex) <li>black hoodie - test user</li>


        itemList.appendChild(li); // 방금 만든 li를 ul 안에 넣기
      });
    });
  });
  </script>
</body>
</html>
