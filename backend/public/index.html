<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>API Test Page</title>
</head>
<body>
  <h1>API 연결 테스트</h1>
  <button id="btn">GET /api/hello</button>

  <pre id="result"></pre>

  <h2>아이템 목록 조회</h2>

  <button id="loadItems">GET /api/items</button>

  <ul id="itemList"></ul>

  <h2>아이템 추가</h2>

  <input id="userIdInput" placeholder="user_id" />
  <input id="itemNameInput" placeholder="item name" />
  <input id="itemDescInput" placeholder="description" />

  <button id="createItem">POST /api/items</button>

  <pre id="createResult"></pre>

<script>
  document.getElementById('btn').addEventListener('click', async () => { 
    const res = await fetch('/api/hello');
    const data = await res.json();

    document.getElementById('result').textContent =
      JSON.stringify(data, null, 2);
  });

async function loadItems() {
  const res = await fetch('/api/items');
  const data = await res.json();

  const itemList = document.getElementById('itemList');
  itemList.innerHTML = '';

  data.forEach((item) => {
    const li = document.createElement('li');

    li.textContent = `${item.id}. ${item.name} - ${item.description} / 작성자: ${item.user_name} `;

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = '삭제';

    deleteBtn.addEventListener('click', async () => {
      const response = await fetch(`/api/items/${item.id}`, {
        method: 'DELETE',
      });

      const result = await response.json();
      console.log(result);

      await loadItems();
    });

    li.appendChild(deleteBtn);
    itemList.appendChild(li);
  });
}

  document.getElementById('loadItems').addEventListener('click', loadItems);

  document.getElementById('createItem').addEventListener('click', async () => {
    const user_id = document.getElementById('userIdInput').value;
    const name = document.getElementById('itemNameInput').value;
    const description = document.getElementById('itemDescInput').value;

    const res = await fetch('/api/items', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        user_id,
        name,
        description,
      }),
    });

    const data = await res.json();

    document.getElementById('createResult').textContent =
      JSON.stringify(data, null, 2);

    await loadItems();
  });
</script>
</body>
</html>
